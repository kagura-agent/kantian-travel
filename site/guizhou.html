<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2026 贵州干饭行 — 看天出发</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background:#f5f5f5; color:#333; }

.trip-header {
  position: sticky; top:0; z-index:100;
  background: #fff; padding: 12px 16px;
  border-bottom: 1px solid #eee;
  display: flex; align-items: center; gap: 12px;
}
.trip-header h1 { font-size: 18px; font-weight: 700; flex:1; }
.trip-meta { font-size: 12px; color: #999; }

.day-tabs {
  display: flex; overflow-x: auto; gap: 0;
  background: #fff; border-bottom: 1px solid #eee;
  position: sticky; top: 52px; z-index: 99;
  -webkit-overflow-scrolling: touch;
}
.day-tab {
  flex-shrink: 0; padding: 10px 16px;
  font-size: 13px; color: #666; border: none; background: none;
  border-bottom: 2px solid transparent; cursor: pointer;
  white-space: nowrap;
}
.day-tab.active { color: #FF6B4A; border-bottom-color: #FF6B4A; font-weight: 600; }
.day-tab .tab-weather { font-size: 11px; display: block; margin-top: 2px; }

.day-hero {
  width: 100%; height: 200px; object-fit: cover;
  display: block;
}
.day-activity-label {
  padding: 12px 16px; font-size: 15px; font-weight: 600;
  background: #fff; border-bottom: 1px solid #f0f0f0;
}

.timeline { padding: 16px; }
.tl-step { display: flex; gap: 12px; margin-bottom: 0; }
.tl-left { display: flex; flex-direction: column; align-items: center; width: 50px; flex-shrink:0; }
.tl-time { font-size: 11px; color: #999; margin-bottom: 4px; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink:0; }
.tl-line { width: 2px; flex:1; min-height: 20px; opacity: 0.3; margin: 4px 0; }
.tl-right { flex:1; padding-bottom: 20px; }
.tl-type { font-size: 11px; font-weight: 600; }
.tl-text { font-size: 14px; font-weight: 500; margin: 2px 0 4px; }
.tl-desc { font-size: 12px; color: #666; line-height: 1.5; margin-bottom: 6px; }
.tl-tip { font-size: 12px; color: #8B5E3C; background: #FFF8F0; padding: 4px 8px; border-radius: 4px; margin: 4px 0; }
.tl-booking { display: inline-block; font-size: 11px; background: #F0F7FF; color: #2B7DE9; padding: 3px 8px; border-radius: 4px; margin: 3px 4px 3px 0; }
.tl-source { font-size: 11px; color: #999; margin-top: 4px; }
.tl-source .src-icon { margin-right: 2px; }

.tl-actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.tl-action { font-size: 11px; color: #FF6B4A; border: 1px solid #FFD4C9; padding: 4px 10px; border-radius: 16px; text-decoration: none; }

.route-map { height: 200px; margin: 16px; border-radius: 12px; overflow: hidden; }

.color-depart { background: #4A9EFF; }
.color-transit { background: #999; }
.color-play { background: #4CAF50; }
.color-eat { background: #FF9800; }
.color-stay { background: #9C27B0; }
.color-home { background: #FF6B4A; }
</style>
</head>
<body>

<div class="trip-header">
  <h1>2026 贵州干饭行</h1>
  <span class="trip-meta">6天5夜 · 4人 · 高铁+租车</span>
</div>

<div class="day-tabs" id="dayTabs"></div>
<div id="dayContent"></div>
<div id="routeMap" class="route-map"></div>

<script src="data-guizhou.js?v=2"></script>
<script>
const plan = PLANS[0];
const TYPE_COLORS = { depart:'#4A9EFF', transit:'#999', play:'#4CAF50', eat:'#FF9800', stay:'#9C27B0', home:'#FF6B4A' };
const TYPE_LABELS = { depart:'出发', transit:'交通', play:'游玩', eat:'美食', stay:'住宿', home:'返程' };

let currentDay = 0;

// Render day tabs
const tabsEl = document.getElementById('dayTabs');
tabsEl.innerHTML = plan.days.map((d, i) => `
  <button class="day-tab ${i===0?'active':''}" data-day="${i}">
    Day${i+1}
    <span class="tab-weather">${d.weather.icon} ${d.weather.temp}</span>
  </button>
`).join('');

tabsEl.addEventListener('click', e => {
  const btn = e.target.closest('.day-tab');
  if (!btn) return;
  currentDay = parseInt(btn.dataset.day);
  tabsEl.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderDay(currentDay);
});

function renderDay(idx) {
  const day = plan.days[idx];
  const content = document.getElementById('dayContent');
  
  const stepsHTML = day.steps.map((step, si) => {
    const color = TYPE_COLORS[step.type] || '#999';
    const isLast = si === day.steps.length - 1;
    
    let extras = '';
    if (step.description) extras += `<p class="tl-desc">${step.description}</p>`;
    if (step.tips) extras += step.tips.map(t => `<div class="tl-tip">💡 ${t}</div>`).join('');
    if (step.bookings) extras += step.bookings.map(b => `<span class="tl-booking">${b.label}${b.cost ? ' '+b.cost : ''}</span>`).join('');
    if (step.relatedContent) extras += step.relatedContent.map(c => `<div class="tl-source"><span class="src-icon">${c.icon}</span>${c.title}</div>`).join('');
    
    let actions = '';
    if (step.place?.name) {
      actions += `<a class="tl-action" href="https://uri.amap.com/navigation?to=${encodeURIComponent(step.place.name)}&mode=car" target="_blank">📍 导航</a>`;
    }
    
    return `
      <div class="tl-step">
        <div class="tl-left">
          <span class="tl-time">${step.startTime || ''}</span>
          <div class="tl-dot color-${step.type}"></div>
          ${!isLast ? `<div class="tl-line" style="background:${color}"></div>` : ''}
        </div>
        <div class="tl-right">
          <span class="tl-type" style="color:${color}">${TYPE_LABELS[step.type] || ''}</span>
          <div class="tl-text">${step.text}</div>
          ${extras}
          ${actions ? `<div class="tl-actions">${actions}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  content.innerHTML = `
    <img class="day-hero" src="${day.photo}" alt="${day.activity}" onerror="this.style.display='none'">
    <div class="day-activity-label">${day.activity}</div>
    <div class="timeline">${stepsHTML}</div>
  `;
  
  renderMap(idx);
}

function renderMap(idx) {
  const mapEl = document.getElementById('routeMap');
  const points = plan.days[idx].steps
    .filter(s => s.place?.lat && s.place?.lng)
    .map(s => s.place);
  
  if (points.length < 2) { mapEl.style.display = 'none'; return; }
  mapEl.style.display = 'block';
  mapEl.innerHTML = '';
  
  const map = L.map(mapEl, { zoomControl: false, attributionControl: false });
  const coords = points.map(p => [p.lat, p.lng]);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  L.polyline(coords, { color: '#FF6B4A', weight: 3 }).addTo(map);
  points.forEach((p, i) => {
    L.circleMarker([p.lat, p.lng], { radius: 6, color: '#FF6B4A', fillColor: '#fff', fillOpacity: 1, weight: 2 })
      .bindTooltip(p.name, { permanent: points.length <= 5, direction: 'top', offset: [0, -8] })
      .addTo(map);
  });
  map.fitBounds(coords, { padding: [30, 30] });
}

// Init
renderDay(0);
</script>
</body>
</html>
