<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2026 贵州干饭行 — 看天出发</title>
<link rel="stylesheet" href="style.css?v=5">
<style>
/* Single trip mode: detail sheet as full page, not overlay */
.top-bar { display: none !important; }
.card-list { display: none !important; }
.detail-overlay { position: static !important; opacity: 1 !important; pointer-events: auto !important; background: none !important; backdrop-filter: none !important; }
.detail-overlay .detail-sheet { position: static !important; transform: none !important; width: 100% !important; max-width: 100% !important; max-height: none !important; height: auto !important; border-radius: 0 !important; overflow-y: visible !important; overscroll-behavior: auto !important; }
.detail-close { display: none !important; }
body { overflow-y: auto !important; height: auto !important; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>if(!window.L){document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>')}</script>
</head>
<body>
<!-- Top Bar (hidden on load) -->
<header class="top-bar">
  <div class="top-bar-inner">
    <div class="location-pin" id="locationBtn">
      <span class="loc-icon">📍</span>
      <span class="loc-name">贵州</span>
    </div>
    <h1 class="app-name">看天出发</h1>
    <nav class="time-tabs" id="timeTabs"></nav>
    <button class="shortlist-btn" id="shortlistBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span class="badge" id="shortlistBadge">0</span>
    </button>
  </div>
</header>

<!-- Card List (hidden on load) -->
<main class="card-list" id="cardList"></main>

<!-- Detail Overlay -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-sheet" id="detailSheet">
    <button class="detail-close" id="detailClose">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- Shortlist Panel -->
<div class="shortlist-overlay" id="shortlistOverlay">
  <div class="shortlist-panel">
    <div class="shortlist-header">
      <h2>我的收藏</h2>
      <button class="detail-close" id="shortlistClose">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="shortlist-body" id="shortlistBody"></div>
  </div>
</div>

<!-- Settings Panel -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <h2>设置</h2>
      <button class="detail-close" id="settingsClose">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <h3 class="settings-label">📍 当前位置</h3>
        <div class="city-options" id="cityOptions">
          <button class="city-btn active" data-city="贵阳">贵阳</button>
        </div>
      </div>
      <div class="settings-section">
        <h3 class="settings-label">🗓️ 显示标签</h3>
        <div class="tag-options" data-group="time">
          <label class="tag-toggle"><input type="checkbox" data-tag="weekend" checked><span>国庆</span></label>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="data-guizhou.js?v=2"></script>
<script src="app-v2.js?v=5"></script>
<script>
// Single trip mode: just open the detail view, CSS handles the rest
setTimeout(() => {
  if (PLANS.length >= 1) {
    openDetail(PLANS[0]);
    // Add "历史预估" labels to weather displays
    setTimeout(() => {
      document.querySelectorAll('.vt-weather').forEach((el, i) => {
        const note = PLANS[0].days[i]?.weather?.note;
        if (note) el.innerHTML += '<span style="font-size:9px;opacity:0.7;display:block">(预估)</span>';
      });
    }, 100);
  }
}, 50);
</script>
</body>
</html>
